name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Prepare app
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          mkdir -p app/www && cd app
          cat > package.json <<'JSON'
          {"name":"sps-group-app","version":"1.0.0","private":true,
           "dependencies":{"@capacitor/android":"7.6.11","@capacitor/core":"7.6.11","@capacitor/cli":"7.6.11",
           "@capacitor/local-notifications":"^7.0.0","@capacitor/filesystem":"^7.0.0","@capacitor/share":"^7.0.0","@capacitor-community/background-geolocation":"1.3.2"}}
          JSON
          cat > capacitor.config.json <<'JSON'
          {"appId":"uz.spsgroup.app","appName":"SPS Group","webDir":"www",
           "server":{"url":"https://spsgroup-uz.github.io/sps/","androidScheme":"https",
             "allowNavigation":["spsgroup-uz.github.io","*.googleapis.com","*.gstatic.com","*.firebaseapp.com","cbu.uz","*.open-meteo.com","open.er-api.com","api.telegram.org","unpkg.com","*.openstreetmap.org"]},
           "android":{"useLegacyBridge":true,"allowMixedContent":false}}
          JSON
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><p>SPS Group…</p><script>location.replace("https://spsgroup-uz.github.io/sps/")</script></body></html>' > www/index.html
          if [ -f ../icon-512.png ]; then cp ../icon-512.png www/icon.png; else convert -size 512x512 xc:'#4f46e5' www/icon.png; fi
          npm install
          npx cap add android
          npx cap sync android
      - name: Permissions and icon
        working-directory: app
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for p in ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION FOREGROUND_SERVICE FOREGROUND_SERVICE_LOCATION POST_NOTIFICATIONS WAKE_LOCK; do
            grep -q "android.permission.$p\"" "$M" || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$p\" />\n</manifest>#" "$M"
          done
          R=android/app/src/main/res
          rm -rf "$R/mipmap-anydpi-v26"
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}; mkdir -p "$R/mipmap-$n"
            convert www/icon.png -resize ${s}x${s} "$R/mipmap-$n/ic_launcher.png"
            cp "$R/mipmap-$n/ic_launcher.png" "$R/mipmap-$n/ic_launcher_round.png"
            rm -f "$R/mipmap-$n/ic_launcher_foreground.png"
          done
      - name: Build APK
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp app/android/app/build/outputs/apk/debug/app-debug.apk SPS-Group.apk
      - uses: actions/upload-artifact@v4
        with: { name: SPS-Group-apk, path: SPS-Group.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: SPS Group APK ${{ github.run_number }}
          files: SPS-Group.apk
          make_latest: true
